
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Service Deaktiviert</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap');

:root {
    --purple: #8b35ff;
    --purple-light: #c18aff;
    --purple-dark: #3c0878;
    --background: #050308;
    --white: #f8f5ff;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    overflow-x: hidden;
    background:
        radial-gradient(ellipse at 50% 45%,
        rgba(91, 24, 155, 0.19), transparent 58%),
        #050308;
    color: var(--white);
    font-family: 'Inter', sans-serif;
}

/* Hintergrundeffekte */

.background-glow {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
}

.glow {
    position: absolute;
    width: 450px;
    height: 450px;
    border-radius: 50%;
    background: rgba(115, 35, 255, 0.12);
    filter: blur(110px);
    animation: float 10s ease-in-out infinite alternate;
}

.glow.one {
    top: -180px;
    left: -100px;
}

.glow.two {
    right: -150px;
    bottom: -180px;
    animation-delay: -5s;
}

@keyframes float {
    from { transform: translate(0, 0); }
    to   { transform: translate(100px, 70px); }
}

/* Partikel */

.particles {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 1;
}

.particle {
    position: absolute;
    bottom: -20px;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: #bd83ff;
    box-shadow: 0 0 12px 3px rgba(145, 61, 255, 0.45);
    animation: rise linear infinite;
}

.particle:nth-child(1) { left: 8%; animation-duration: 13s; }
.particle:nth-child(2) { left: 18%; animation-duration: 17s; animation-delay: 3s; }
.particle:nth-child(3) { left: 29%; animation-duration: 12s; animation-delay: 5s; }
.particle:nth-child(4) { left: 42%; animation-duration: 16s; animation-delay: 1s; }
.particle:nth-child(5) { left: 56%; animation-duration: 14s; animation-delay: 4s; }
.particle:nth-child(6) { left: 68%; animation-duration: 18s; animation-delay: 2s; }
.particle:nth-child(7) { left: 79%; animation-duration: 12s; animation-delay: 6s; }
.particle:nth-child(8) { left: 91%; animation-duration: 15s; animation-delay: 2s; }
.particle:nth-child(9) { left: 35%; animation-duration: 19s; animation-delay: 7s; }
.particle:nth-child(10) { left: 73%; animation-duration: 16s; animation-delay: 9s; }

@keyframes rise {
    0% {
        transform: translateY(0) scale(.5);
        opacity: 0;
    }
    15% { opacity: .9; }
    85% { opacity: .5; }
    100% {
        transform: translateY(-110vh) scale(1.4);
        opacity: 0;
    }
}

/* Hauptbereich */

main {
    position: relative;
    z-index: 2;
    width: 100%;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 55px 24px 30px;
}

/* Überschrift */

.header {
    text-align: center;
    margin-bottom: 30px;
    animation: fadeIn .9s ease both;
}

.eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    padding: 8px 15px;
    margin-bottom: 22px;
    border: 1px solid rgba(172, 105, 255, .35);
    border-radius: 50px;
    background: rgba(102, 35, 170, .12);
    color: #d6b8ff;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
}

.eyebrow-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #ff0000;
    box-shadow: 0 0 12px #a35cff;
}

h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(28px, 5vw, 55px);
    font-weight: 800;
    letter-spacing: clamp(1px, .6vw, 6px);
    line-height: 1.25;
    text-shadow:
        0 0 20px rgba(145, 57, 255, .45),
        0 0 55px rgba(108, 25, 255, .20);
}

h1 span {
    color: var(--purple-light);
}

.subtitle {
    margin-top: 14px;
    color: #a9a0b7;
    font-size: 13px;
    letter-spacing: 2px;
}

/* Bildrahmen */

.image-container {
    position: relative;
    width: min(100%, 1050px);
    padding: 3px;
    border-radius: 5px;
    background: linear-gradient(
        135deg,
        #9f50ff,
        #27103e 25%,
        #160d22 70%,
        #b76cff
    );
    box-shadow:
        0 0 25px rgba(136, 50, 255, .20),
        0 0 85px rgba(116, 31, 255, .12);
    animation: imageAppear 1.2s ease both;
}

.image-container::before {
    content: "";
    position: absolute;
    inset: -2px;
    border-radius: 5px;
    background: linear-gradient(
        120deg,
        transparent 15%,
        rgba(194, 132, 255, .8) 50%,
        transparent 85%
    );
    background-size: 200% 100%;
    animation: borderShine 6s linear infinite;
    z-index: -1;
}

@keyframes borderShine {
    from { background-position: 200% 0; }
    to   { background-position: -200% 0; }
}

.image-inner {
    position: relative;
    overflow: hidden;
    background: #09060e;
    line-height: 0;
}

.image-inner img {
    display: block;
    width: 100%;
    height: auto;
    object-fit: contain;
    transition: transform .8s ease, filter .8s ease;
    filter: saturate(1.08) contrast(1.04);
}

.image-container:hover .image-inner img {
    transform: scale(1.015);
    filter: saturate(1.2) contrast(1.07);
}

/* Dekorative Ecken */

.corner {
    position: absolute;
    width: 45px;
    height: 45px;
    z-index: 3;
    pointer-events: none;
}

.corner.tl {
    top: 0;
    left: 0;
    border-top: 3px solid #c28aff;
    border-left: 3px solid #c28aff;
}

.corner.tr {
    top: 0;
    right: 0;
    border-top: 3px solid #c28aff;
    border-right: 3px solid #c28aff;
}

.corner.bl {
    bottom: 0;
    left: 0;
    border-bottom: 3px solid #c28aff;
    border-left: 3px solid #c28aff;
}

.corner.br {
    bottom: 0;
    right: 0;
    border-bottom: 3px solid #c28aff;
    border-right: 3px solid #c28aff;
}

/* Unterer Infobereich */

.info {
    width: min(100%, 1050px);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    margin-top: 25px;
    padding: 18px 21px;
    border: 1px solid rgba(156, 89, 230, .22);
    border-radius: 5px;
    background: rgba(18, 11, 27, .78);
    backdrop-filter: blur(12px);
    animation: fadeIn 1.3s ease both;
}

.info-label {
    color: #93889f;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 7px;
}

.info-title {
    font-size: 13px;
    font-weight: 700;
}

.status {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 10px 13px;
    border: 1px solid rgba(170, 99, 255, .3);
    border-radius: 4px;
    background: rgba(118, 41, 180, .12);
    color: #d3b4ff;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1px;
    white-space: nowrap;
}

.status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: red;
    box-shadow: 0 0 10px #a86aff;
    animation: pulse 2s infinite;
}

@keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: .35; }
}

footer {
    margin-top: 25px;
    color: #62576f;
    text-align: center;
    font-size: 10px;
    letter-spacing: 2px;
}

footer span {
    color: #a86aff;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(15px); }
    to   { opacity: 1; transform: translateY(0); }
}

@keyframes imageAppear {
    from { opacity: 0; transform: scale(.97); }
    to   { opacity: 1; transform: scale(1); }
}

/* Smartphone */

@media (max-width: 600px) {
    main {
        padding: 35px 12px 22px;
    }

    .header {
        margin-bottom: 23px;
    }

    .subtitle {
        font-size: 10px;
        letter-spacing: 1px;
    }

    .image-container {
        width: 100%;
    }

    .info {
        padding: 14px;
        gap: 10px;
    }

    .info-title {
        font-size: 11px;
    }

    .status {
        font-size: 8px;
        padding: 9px;
        gap: 6px;
        letter-spacing: .5px;
    }

    .corner {
        width: 25px;
        height: 25px;
    }

    footer {
        font-size: 8px;
        letter-spacing: 1px;
    }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
    }
}
</style>
</head>

<body>

<div class="background-glow">
    <div class="glow one"></div>
    <div class="glow two"></div>
</div>

<div class="particles">
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
</div>

<main>

    <header class="header">
        <div class="eyebrow">
            <span class="eyebrow-dot"></span>
            SYSTEM STATUS
        </div>

        <h1> <span>There was a Time....</span></h1>

        <p class="subtitle">
           
        </p>

    <section class="image-container">
        <div class="image-inner">

            <!-- Dein Gruppenbild hier einfügen -->
            <img src="gangbild.png"

        </div>

        <div class="status">

        </div>
    </section>
   <section class="info">
        <div>
            <p class="info-title">Mizuki Rechner</p>
        </div>

        <div class="status">
            <span class="status-dot"></span>
            DEAKTIVIERT
        </div>
    </section>
    <footer>
       
    </footer>

</main>

</body>
</html>
